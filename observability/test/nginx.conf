# a small copy of a real setup: nginx serves the site and hands 403s, 405s and
# missing files to the nginwho trap on 127.0.0.1:7777

# test only: take the visitor IP from X-Forwarded-For, so the traffic script can
# pretend to come from anywhere. behind a CDN, nginwho writes this part for you
set_real_ip_from 0.0.0.0/0;
real_ip_header X-Forwarded-For;

server {
    listen 80;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log combined;

    error_page 404 /404.html;
    error_page 403 405 = @trap;

    location @trap {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 15m;
        proxy_intercept_errors on;
        error_page 404 /404.html;
        error_page 502 504 =404 /404.html;
        gzip off;
        access_log off;
    }

    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        if ($http_user_agent ~* (python|curl|wget|Go-http-client|zgrab)) { return 403; }
        try_files $uri $uri/ @trap;
    }
}

# for the nginx prometheus exporter
server {
    listen 127.0.0.1:8080;
    access_log off;

    location = /stub_status {
        stub_status on;
    }
}
