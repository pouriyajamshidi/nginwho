# nginwho next to nginx: saves the nginx log and runs the trap
[database]
path = /var/lib/nginwho/nginwho.db

[nginx]
log_path = /var/log/nginx/access.log
interval = 10
show_real_ips = false
block_untrusted_cidrs = false
process_logs = true

[trap]
enabled = true
port = 7777
max_seconds = 60
bombs = true
bomb_after = 3
