# nginwho config file. Put it at /etc/nginwho/nginwho.conf
# Command line flags override anything set here.

[database]
path = /var/log/nginwho.db

[nginx]
log_path = /var/log/nginx/access.log
interval = 30
show_real_ips = true
block_untrusted_cidrs = true
process_logs = true

# The static file server. Off by default, nginx usually serves the site
[server]
enabled = false
root = /var/www/html
port = 80

# The trap. nginx forwards its 403s and 404s here and we play with the bots.
# See the README for the matching nginx config
[trap]
enabled = true
port = 7777
max_connections = 200
max_seconds = 900
drip_min_ms = 500
drip_max_ms = 700
bombs = true
# bomb an IP after this many trapped hits in one day
bomb_after = 3
