# nginwho config file. Put it at /etc/nginwho/nginwho.conf
# Command line flags override anything set here.

[database]
path = /var/lib/nginwho/nginwho.db

# The access log, from nginx or the built-in server
[logs]
# save visits for the reports
process = true
# the log to read. when not set, nginx's at /var/log/nginx/access.log, or with
# [server] enabled, the server's own at /var/log/nginwho/access.log
#path = /var/log/nginx/access.log
interval = 30
# don't save referrers from this domain and its subdomains, like your own site
#omit_referrer = example.com

# The CDN in front of your site, if any
[cdn]
# cloudflare or fastly. show_real_ips and block_untrusted_cidrs trust its ranges
name = cloudflare
# with [server] enabled, the server reads the CDN's real IP header instead of writing a file for nginx
show_real_ips = true
block_untrusted_cidrs = true

# The static file server. Off by default, nginx usually serves the site
[server]
enabled = false
root = /var/www/html
port = 80
# HTTPS, with the same files nginx takes. Both empty means plain HTTP.
# A renewed certificate is picked up without a restart
#cert = /etc/ssl/example.com.pem
#key = /etc/ssl/example.com.key

# Drop everything coming in but SSH, the web ports, and what the server needs to work.
# Off by default. Set ssh_port to your SSH port, or a wrong one locks you out.
# When not set, the port sshd listens on is used. web_ports are kept open over TCP,
# and quic_ports over UDP for HTTP/3. Separate ports with spaces.
# block_untrusted_cidrs under [cdn] lets only the CDN reach both, with or without lockdown
[firewall]
lockdown = false
#ssh_port = 22
web_ports = 80 443
#quic_ports = 443

# The trap. nginx forwards its 403s and 404s here and we play with the bots.
# See the README for the matching nginx config
[trap]
enabled = true
port = 7777
max_connections = 200
max_seconds = 900
drip_min_ms = 500
drip_max_ms = 700
bombs = true
# bomb an IP after this many trapped hits in one day. IPv6 is counted by /64
bomb_after = 3
# bombs sent in one day, to all IPs. each is about 10 MB to send. 0 for no limit
max_bombs_a_day = 100
# hits saved in one day, from all IPs. past it bots are still trapped. 0 for no limit
max_saved_hits_a_day = 100000
# a folder of your own fake files. one named like a built-in file (env.txt, login.html, ...)
# is sent in its place, see the README
#files = /etc/nginwho/traps

# User agents to trap whatever they ask for. The name is matched anywhere in the
# User-Agent header, case ignored. Pick drip, endless, maze, login or bomb, or leave
# the name on its own for the default: what any bot gets for that path, a drip otherwise.
# Behind nginx, block the same user agents with a 403 so they reach the trap
#[trap.agents]
#deepseek = drip
#gptbot = maze
#bytespider
